<!DOCTYPE html>

<html lang="sl">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1,

maximum-scale=1,

user-scalable=no">

<title>SKICE</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#eee;

    overflow:hidden;

}

header{

    height:58px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 8px;

    border-bottom:1px solid #ccc;

}

header h2{

    margin:0;

    font-size:18px;

}

button{

    border:0;

    background:#eee;

    border-radius:10px;

    padding:9px 11px;

    font-size:14px;

}

button:active{

    transform:scale(.96);

}

#canvas{

    display:block;

    width:100vw;

    height:calc(100vh - 135px);

    background:white;

    touch-action:none;

}

.toolbar{

    height:77px;

    background:white;

    border-top:1px solid #ccc;

    display:flex;

    justify-content:space-around;

    align-items:center;

    overflow-x:auto;

}

.tool{

    background:transparent;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    min-width:62px;

    height:60px;

}

.tool span{

    font-size:22px;

}

.tool small{

    font-size:10px;

}

.active{

    background:#dceaff;

}

.info{

    position:fixed;

    top:65px;

    left:10px;

    background:rgba(0,0,0,.75);

    color:white;

    padding:7px 10px;

    border-radius:12px;

    font-size:12px;

    z-index:10;

}

.menu,

.modal{

    position:fixed;

    z-index:50;

    background:white;

    border-radius:15px;

    box-shadow:0 5px 30px rgba(0,0,0,.25);

}

.menu{

    top:60px;

    right:8px;

    width:210px;

    padding:10px;

    display:none;

}

.menu button{

    width:100%;

    margin:4px 0;

    text-align:left;

}

.modal{

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:92%;

    max-width:420px;

    max-height:80vh;

    overflow:auto;

    padding:18px;

    display:none;

}

.modal h3{

    margin-top:0;

}

.modal input{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:16px;

    margin-bottom:12px;

}

.draft{

    padding:12px 0;

    border-bottom:1px solid #ddd;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

}

.draftName{

    font-size:16px;

    flex:1;

}

.draftButtons{

    display:flex;

    gap:4px;

}

.close{

    background:#ddd;

    width:100%;

    margin-top:10px;

}

@media print{

    body{

        overflow:visible;

        background:white;

    }

    header,

    .toolbar,

    .menu,

    .modal,

    .info{

        display:none!important;

    }

    #canvas{

        width:100%;

        height:auto;

    }

}

</style>

<!-- ORODJA -->

<div class="toolbar">

onclick="selectTool('line',this)">

</small>

onclick="selectTool('measure',this)">

Mera

</small>

</button>

onclick="selectTool('angle',this)">

</small>

onclick="selectTool('text',this)">

</small>

onclick="selectTool('erase',this)">

Izbriši

<script>

/* =========================================

   OSNOVNE SPREMENLJIVKE

========================================= */

const canvas =

document.getElementById("canvas");

const ctx =

canvas.getContext("2d");

let tool="line";

let drawing=false;

let moving=false;

let movingObject=null;

let startX=0;

let startY=0;

let offsetX=0;

let offsetY=0;

let gridSize=40;

let gridVisible=true;

let objects=[];

let history=[];

let currentDraftId=null;

/* =========================================

   CANVAS

========================================= */

function resizeCanvas(){

    const r=

    canvas.getBoundingClientRect();

    canvas.width=

    r.width*devicePixelRatio;

    canvas.height=

    r.height*devicePixelRatio;

    ctx.setTransform(

        devicePixelRatio,

        0,

        0,

        devicePixelRatio,

        0,

        0

    );

    redraw();

}

window.addEventListener(

"resize",

resizeCanvas

);

resizeCanvas();

/* =========================================

   MREŽA

========================================= */

function drawGrid(){

    if(!gridVisible)

        return;

    const w=

    canvas.clientWidth;

    const h=

    canvas.clientHeight;

    ctx.save();

    ctx.strokeStyle="#e4e4e4";

    ctx.lineWidth=1;

    for(

        let x=0;

        x<=w;

        x+=gridSize

    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,h);

        ctx.stroke();

    }

    for(

        let y=0;

        y<=h;

        y+=gridSize

    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(w,y);

        ctx.stroke();

    }

    ctx.restore();

}

/* =========================================

   PRIPENJANJE NA MREŽO

========================================= */

function snap(value){

    if(!gridVisible)

        return value;

    return Math.round(

        value/gridSize

    )*gridSize;

}

/* =========================================

   ORODJA

========================================= */

function selectTool(

    selectedTool,

    button

){

    tool=selectedTool;

    document

    .querySelectorAll(".tool")

    .forEach(

        b=>b.classList.remove("active")

    );

    button.classList.add("active");

}

/* =========================================

   MENI

========================================= */

function openMenu(){

    const menu=

    document.getElementById("menu");

    menu.style.display=

    menu.style.display==="block"

    ?"none"

    :"block";

}

function openGridMenu(){

    document

    .getElementById("menu")

    .style.display="none";

    const menu=

    document.getElementById("gridMenu");

    menu.style.display=

    menu.style.display==="block"

    ?"none"

    :"block";

}

function setGrid(value){

    gridSize=value*4;

    document

    .getElementById("info")

    .innerText=

    "Mreža: "+value+" cm";

    document

    .getElementById("gridMenu")

    .style.display="none";

    redraw();

}

function toggleGrid(){

    gridVisible=!gridVisible;

    document

    .getElementById("gridMenu")

    .style.display="none";

    redraw();

}

/* =========================================

   POZICIJA

========================================= */

function getPosition(e){

    const r=

    canvas.getBoundingClientRect();

    return{

        x:e.clientX-r.left,

        y:e.clientY-r.top

    };

}

/* =========================================

   RISANJE - ZAČETEK

========================================= */

canvas.addEventListener(

"pointerdown",

function(e){

    e.preventDefault();

    const p=

    getPosition(e);

    /* TEKST */

    if(tool==="text"){

        const text=

        prompt(

            "Vpiši besedilo:"

        );

        if(text){

            saveHistory();

            objects.push({

                type:"text",

                x:snap(p.x),

                y:snap(p.y),

                text:text

            });

            redraw();

        }

        return;

    }

    /* PREMIKANJE */

    if(tool==="move"){

        const obj=

        findText(

            p.x,

            p.y

        );

        if(obj){

            saveHistory();

            moving=true;

            movingObject=obj;

            offsetX=

            p.x-obj.x;

            offsetY=

            p.y-obj.y;

        }

        return;

    }

    /* BRISANJE */

    if(tool==="erase"){

        eraseObject(

            p.x,

            p.y

        );

        return;

    }

    /* RISANJE */

    drawing=true;

    startX=

    snap(p.x);

    startY=

    snap(p.y);

});

/* =========================================

   RISANJE - PREMIKANJE

========================================= */

canvas.addEventListener(

"pointermove",

function(e){

    e.preventDefault();

    const p=

    getPosition(e);

    if(

        moving &&

        movingObject

    ){

        movingObject.x=

        snap(

            p.x-offsetX

        );

        movingObject.y=

        snap(

            p.y-offsetY

        );

        redraw();

        return;

    }

    if(!drawing)

        return;

    const x=

    snap(p.x);

    const y=

    snap(p.y);

    redraw();

    ctx.save();

    ctx.strokeStyle="#555";

    ctx.lineWidth=2;

    ctx.setLineDash([

        6,

        5

    ]);

    ctx.beginPath();

    ctx.moveTo(

        startX,

        startY

    );

    ctx.lineTo(

        x,

        y

    );

    ctx.stroke();

    ctx.restore();

});

/* =========================================

   RISANJE - KONEC

========================================= */

canvas.addEventListener(

"pointerup",

function(e){

    /* PREMIKANJE */

    if(moving){

        moving=false;

        movingObject=null;

        redraw();

        return;

    }

    if(!drawing)

        return;

    drawing=false;

    const p=

    getPosition(e);

    const endX=

    snap(p.x);

    const endY=

    snap(p.y);

    if(

        Math.abs(endX-startX)<5 &&

        Math.abs(endY-startY)<5

    ){

        return;

    }

    saveHistory();

    let label="";

    /* MERA */

    if(tool==="measure"){

        /*

        Prazno polje.

        Brez primera.

        Brez enote.

        */

        label=

        prompt(

            "Vpiši mero:"

        );

    }

    /* KOT */

    if(tool==="angle"){

        label=

        prompt(

            "Vpiši kot:"

        );

    }

    objects.push({

        type:tool,

        x1:startX,

        y1:startY,

        x2:endX,

        y2:endY,

        label:label||""

    });

    redraw();

});

/* =========================================

   ZAKLJUČEK DOTIKA

========================================= */

canvas.addEventListener(

"pointercancel",

function(){

    drawing=false;

    moving=false;

    movingObject=null;

});

/* =========================================

   ISKANJE TEKSTA

========================================= */

function findText(x,y){

    for(

        let i=objects.length-1;

        i>=0;

        i--

    ){

        const obj=

        objects[i];

        if(obj.type!=="text")

            continue;

        ctx.font=

        "16px Arial";

        const width=

        ctx.measureText(

            obj.text

        ).width;

        if(

            x>=obj.x-10 &&

            x<=obj.x+width+10 &&

            y>=obj.y-25 &&

            y<=obj.y+10

        ){

            return obj;

        }

    }

    return null;

}

/* =========================================

   RISANJE OBJEKTOV

========================================= */

function redraw(){

    ctx.clearRect(

        0,

        0,

        canvas.clientWidth,

        canvas.clientHeight

    );

    drawGrid();

    objects.forEach(

    function(obj){

        ctx.save();

        ctx.strokeStyle="#111";

        ctx.fillStyle="#111";

        ctx.lineWidth=2;

        /* ČRTE */

        if(

            obj.type==="line" ||

            obj.type==="measure" ||

            obj.type==="angle"

        ){

            ctx.beginPath();

            ctx.moveTo(

                obj.x1,

                obj.y1

            );

            ctx.lineTo(

                obj.x2,

                obj.y2

            );

            ctx.stroke();

            /* NAPIS MERE */

            if(obj.label){

                const x=

                (obj.x1+obj.x2)/2;

                const y=

                (obj.y1+obj.y2)/2;

                ctx.font=

                "16px Arial";

                const width=

                ctx.measureText(

                    obj.label

                ).width;

                /* ozadje napisa */

                ctx.fillStyle="white";

                ctx.fillRect(

                    x-width/2-5,

                    y-20,

                    width+10,

                    25

                );

                ctx.fillStyle="#111";

                ctx.fillText(

                    obj.label,

                    x-width/2,

                    y-2

                );

            }

        }

        /* TEKST */

        if(obj.type==="text"){

            ctx.font=

            "16px Arial";

            ctx.fillText(

                obj.text,

                obj.x,

                obj.y

            );

        }

        ctx.restore();

    });

}

/* =========================================

   ZGODOVINA

========================================= */

function saveHistory(){

    history.push(

        JSON.stringify(objects)

    );

}

/* =========================================

   RAZVELJAVI

========================================= */

function undo(){

    if(history.length===0){

        return;

    }

    objects=

    JSON.parse(

        history.pop()

    );

    redraw();

}

/* =========================================

   NOVA SKICA

========================================= */

function newSketch(){

    if(

        !confirm(

            "Začnem novo skico?"

        )

    )

        return;

    objects=[];

    history=[];

    currentDraftId=null;

    document

    .getElementById("title")

    .innerText=

    "Nova skica";

    redraw();

}

/* =========================================

   BRISANJE

========================================= */

function eraseObject(x,y){

    let index=-1;

    let closest=20;

    objects.forEach(

    function(obj,i){

        if(!obj.x1)

            return;

        const d=

        pointLineDistance(

            x,

            y,

            obj.x1,

            obj.y1,

            obj.x2,

            obj.y2

        );

        if(d<closest){

            closest=d;

            index=i;

        }

    });

    /* ČE NI ČRTA,

       POSKUSIMO NAJTI TEKST */

    if(index<0){

        const text=

        findText(x,y);

        if(text){

            saveHistory();

            objects.splice(

                objects.indexOf(text),

                1

            );

            redraw();

        }

        return;

    }

    saveHistory();

    objects.splice(

        index,

        1

    );

    redraw();

}

/* =========================================

   RAZDALJA TOČKE OD ČRTE

========================================= */

function pointLineDistance(

    px,

    py,

    x1,

    y1,

    x2,

    y2

){

    const A=

    px-x1;

    const B=

    py-y1;

    const C=

    x2-x1;

    const D=

    y2-y1;

    const dot=

    A*C+B*D;

    const len=

    C*C+D*D;

    let t=

    dot/len;

    t=

    Math.max(

        0,

        Math.min(1,t)

    );

    const xx=

    x1+t*C;

    const yy=

    y1+t*D;

    return Math.sqrt(

        (px-xx)**2+

        (py-yy)**2

    );

}

/* =========================================

   OSNUTKI

========================================= */

function getDrafts(){

    return JSON.parse(

        localStorage.getItem(

            "skiceOriginalDrafts"

        ) || "[]"

    );

}

/* =========================================

   SHRANI OSNUTEK

========================================= */

function saveDraft(){

    document

    .getElementById(

        "draftNameInput"

    )

    .value="";

    document

    .getElementById(

        "nameModal"

    )

    .style.display=

    "block";

}

function confirmSaveDraft(){

    const name=

    document

    .getElementById(

        "draftNameInput"

    )

    .value

    .trim();

    if(!name){

        alert(

            "Vpiši ime osnutka."

        );

        return;

    }

    const drafts=

    getDrafts();

    const newDraft={

        id:Date.now(),

        name:name,

        /*

        Shrani kopijo.

        */

        objects:

        JSON.parse(

            JSON.stringify(

                objects

            )

        ),

        gridSize:

        gridSize,

        gridVisible:

        gridVisible,

        created:

        new Date().toISOString()

    };

    drafts.push(

        newDraft

    );

    localStorage.setItem(

        "skiceOriginalDrafts",

        JSON.stringify(

            drafts

        )

    );

    closeNameModal();

    alert(

        "Osnutek je shranjen kot original."

    );

}

/* =========================================

   ODPRI OSNUTKE

========================================= */

function openDrafts(){

    renderDrafts();

    document

    .getElementById(

        "draftModal"

    )

    .style.display=

    "block";

}

function closeDrafts(){

    document

    .getElementById(

        "draftModal"

    )

    .style.display=

    "none";

}

function renderDrafts(){

    const list=

    document

    .getElementById(

        "draftList"

    );

    const drafts=

    getDrafts();

    if(!drafts.length){

        list.innerHTML=

        "<p>Še nimaš shranjenih osnutkov.</p>";

        return;

    }

    list.innerHTML="";

    drafts

    .slice()

    .reverse()

    .forEach(

    function(draft){

        const row=

        document.createElement(

            "div"

        );

        row.className=

        "draft";

        const name=

        document.createElement(

            "div"

        );

        name.className=

        "draftName";

        name.innerText=

        "📄 "+draft.name;

        const buttons=

        document.createElement(

            "div"

        );

        buttons.className=

        "draftButtons";

        /* UPORABI */

        const open=

        document.createElement(

            "button"

        );

        open.innerText=

        "Uporabi";

        open.onclick=

        function(){

            useDraft(

                draft.id

            );

        };

        /* IZBRIŠI */

        const del=

        document.createElement(

            "button"

        );

        del.innerText=

        "🗑️";

        del.onclick=

        function(){

            deleteDraft(

                draft.id

            );

        };

        buttons.appendChild(

            open

        );

        buttons.appendChild(

            del

        );

        row.appendChild(

            name

        );

        row.appendChild(

            buttons

        );

        list.appendChild(

            row

        );

    });

}

/* =========================================

   UPORABI OSNUTEK

========================================= */

function useDraft(id){

    const drafts=

    getDrafts();

    const draft=

    drafts.find(

        d=>d.id===id

    );

    if(!draft)

        return;

    /*

    Naredimo DELOVNO KOPIJO.

    */

    objects=

    JSON.parse(

        JSON.stringify(

            draft.objects

        )

    );

    gridSize=

    draft.gridSize||40;

    gridVisible=

    draft.gridVisible!==false;

    currentDraftId=

    draft.id;

    history=[];

    document

    .getElementById("title")

    .innerText=

    draft.name;

    document

    .getElementById("info")

    .innerText=

    "Mreža: "+

    (gridSize/4)+

    " cm";

    closeDrafts();

    redraw();

}

/* =========================================

   IZBRIŠI OSNUTEK

========================================= */

function deleteDraft(id){

    if(

        !confirm(

            "Ali res želiš izbrisati ta osnutek?"

        )

    )

        return;

    let drafts=

    getDrafts();

    drafts=

    drafts.filter(

        d=>d.id!==id

    );

    localStorage.setItem(

        "skiceOriginalDrafts",

        JSON.stringify(

            drafts

        )

    );

    renderDrafts();

}

/* =========================================

   ZAPRI OKNO

========================================= */

function closeNameModal(){

    document

    .getElementById(

        "nameModal"

    )

    .style.display=

    "none";

}

/* =========================================

   SHRANI SLIKO

========================================= */

async function saveImage(){

    /*

    Za izvoz skrijemo mrežo.

    */

    const oldGrid=

    gridVisible;

    gridVisible=false;

    redraw();

    try{

        const blob=

        await new Promise(

            resolve=>{

                canvas.toBlob(

                    resolve,

                    "image/png"

                );

            }

        );

        const file=

        new File(

            [blob],

            "skica.png",

            {

                type:"image/png"

            }

        );

        /*

        iPhone / iPad

        */

        if(

            navigator.share &&

            navigator.canShare &&

            navigator.canShare({

                files:[file]

            })

        ){

            await navigator.share({

                files:[file],

                title:"Skica",

                text:"Moja skica"

            });

        }

        /*

        Računalnik

        */

        else{

            const link=

            document.createElement(

                "a"

            );

            link.download=

            "skica.png";

            link.href=

            URL.createObjectURL(

                blob

            );

            link.click();

            setTimeout(

                ()=>{

                    URL.revokeObjectURL(

                        link.href

                    );

                },

                1000

            );

        }

    }

    catch(error){

        console.log(

            "Shranjevanje preklicano:",

            error

        );

    }

    /*

    Vrnemo mrežo.

    */

    gridVisible=

    oldGrid;

    redraw();

}

/* =========================================

   TISK

========================================= */

function printSketch(){

    window.print();

}

</script>
