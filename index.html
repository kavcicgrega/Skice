<!DOCTYPE html>

<html lang="sl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SKICE</title>

<style>

*{box-sizing:border-box}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#eee;

    overflow:hidden;

}

header{

    height:58px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 8px;

    border-bottom:1px solid #ccc;

}

header h2{

    margin:0;

    font-size:18px;

}

button{

    border:0;

    background:#eee;

    border-radius:10px;

    padding:9px 11px;

    font-size:14px;

}

button:active{

    transform:scale(.96);

}

#canvas{

    display:block;

    width:100vw;

    height:calc(100vh - 135px);

    background:white;

    touch-action:none;

}

.toolbar{

    height:77px;

    background:white;

    border-top:1px solid #ccc;

    display:flex;

    justify-content:space-around;

    align-items:center;

    overflow-x:auto;

}

.tool{

    background:transparent;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    min-width:62px;

    height:60px;

}

.tool span{

    font-size:22px;

}

.tool small{

    font-size:10px;

}

.active{

    background:#dceaff;

}

.info{

    position:fixed;

    top:65px;

    left:10px;

    background:rgba(0,0,0,.75);

    color:white;

    padding:7px 10px;

    border-radius:12px;

    font-size:12px;

    z-index:10;

}

.menu,

.modal{

    position:fixed;

    z-index:50;

    background:white;

    border-radius:15px;

    box-shadow:0 5px 30px rgba(0,0,0,.25);

}

.menu{

    top:60px;

    right:8px;

    width:190px;

    padding:10px;

    display:none;

}

.menu button{

    width:100%;

    margin:4px 0;

    text-align:left;

}

.modal{

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:90%;

    max-width:400px;

    padding:18px;

    display:none;

}

.modal h3{

    margin-top:0;

}

.modal input{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:16px;

    margin-bottom:12px;

}

.draft{

    padding:12px;

    border-bottom:1px solid #ddd;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.draftName{

    font-size:16px;

}

.draftButtons button{

    margin-left:4px;

}

.close{

    background:#ddd;

}

@media print{

    body{

        overflow:visible;

        background:white;

    }

    header,

    .toolbar,

    .menu,

    .modal,

    .info{

        display:none!important;

    }

    #canvas{

        width:100%;

        height:auto;

    }

}

</style>

</head>

<body>

<header>

<button onclick="newSketch()">＋</button>

<h2 id="title">Nova skica</h2>

<div>

<button onclick="openDrafts()">📁</button>

<button onclick="openMenu()">☰</button>

</div>

</header>

<div class="info" id="info">

Mreža: 10 cm

</div>

<div class="menu" id="menu">

<button onclick="saveDraft()">

💾 Shrani osnutek

</button>

<button onclick="saveAsNew()">

📋 Shrani kot novo

</button>

<button onclick="saveImage()">

📷 Shrani sliko

</button>

<button onclick="printSketch()">

🖨️ Tisk / PDF

</button>

<button onclick="openGridMenu()">

▦ Nastavitve mreže

</button>

</div>

<div class="menu" id="gridMenu">

<b>Razmik mreže</b>

<button onclick="setGrid(5)">5 cm</button>

<button onclick="setGrid(10)">10 cm</button>

<button onclick="setGrid(25)">25 cm</button>

<button onclick="setGrid(50)">50 cm</button>

<button onclick="setGrid(100)">1 m</button>

<button onclick="toggleGrid()">

Mreža ON / OFF

</button>

</div>

<div class="modal" id="draftModal">

<h3>Osnutki</h3>

<div id="draftList"></div>

<br>

<button class="close" onclick="closeDrafts()">

Zapri

</button>

</div>

<div class="modal" id="nameModal">

<h3>Ime osnutka</h3>

<input

id="draftNameInput"

placeholder="npr. Streha Novak"

>

<button onclick="confirmSave()">

Shrani

</button>

<button class="close" onclick="closeNameModal()">

Prekliči

</button>

</div>

<canvas id="canvas"></canvas>

<div class="toolbar">

<button class="tool active"

onclick="selectTool('line',this)">

<span>╱</span>

<small>Črta</small>

</button>

<button class="tool"

onclick="selectTool('measure',this)">

<span>↔</span>

<small>Mera</small>

</button>

<button class="tool"

onclick="selectTool('angle',this)">

<span>∠</span>

<small>Kot</small>

</button>

<button class="tool"

onclick="selectTool('text',this)">

<span>T</span>

<small>Besedilo</small>

</button>

<button class="tool"

onclick="selectTool('move',this)">

<span>✋</span>

<small>Premakni</small>

</button>

<button class="tool"

onclick="selectTool('erase',this)">

<span>⌫</span>

<small>Izbriši</small>

</button>

</div>

<script>

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

let tool="line";

let drawing=false;

let moving=false;

let movingObject=null;

let startX=0;

let startY=0;

let offsetX=0;

let offsetY=0;

let gridSize=40;

let gridVisible=true;

let objects=[];

let history=[];

let currentDraftId=null;

let currentDraftName="";

/* CANVAS */

function resizeCanvas(){

    const r=canvas.getBoundingClientRect();

    canvas.width=r.width*devicePixelRatio;

    canvas.height=r.height*devicePixelRatio;

    ctx.setTransform(

        devicePixelRatio,0,

        0,devicePixelRatio,

        0,0

    );

    redraw();

}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();

/* GRID */

function drawGrid(){

    if(!gridVisible)return;

    const w=canvas.clientWidth;

    const h=canvas.clientHeight;

    ctx.save();

    ctx.strokeStyle="#e4e4e4";

    ctx.lineWidth=1;

    for(let x=0;x<=w;x+=gridSize){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,h);

        ctx.stroke();

    }

    for(let y=0;y<=h;y+=gridSize){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(w,y);

        ctx.stroke();

    }

    ctx.restore();

}

/* SNAP */

function snap(v){

    if(!gridVisible)return v;

    return Math.round(v/gridSize)*gridSize;

}

/* TOOL */

function selectTool(t,b){

    tool=t;

    document.querySelectorAll(".tool")

    .forEach(x=>x.classList.remove("active"));

    b.classList.add("active");

}

/* MENUS */

function openMenu(){

    const m=document.getElementById("menu");

    m.style.display=

        m.style.display==="block"

        ?"none"

        :"block";

}

function openGridMenu(){

    document.getElementById("menu")

    .style.display="none";

    const m=document.getElementById("gridMenu");

    m.style.display=

        m.style.display==="block"

        ?"none"

        :"block";

}

function setGrid(v){

    gridSize=v*4;

    document.getElementById("info")

    .innerText="Mreža: "+v+" cm";

    document.getElementById("gridMenu")

    .style.display="none";

    redraw();

    autoSave();

}

function toggleGrid(){

    gridVisible=!gridVisible;

    document.getElementById("gridMenu")

    .style.display="none";

    redraw();

    autoSave();

}

/* POSITION */

function pos(e){

    const r=canvas.getBoundingClientRect();

    return{

        x:e.clientX-r.left,

        y:e.clientY-r.top

    };

}

/* POINTER DOWN */

canvas.addEventListener("pointerdown",function(e){

    e.preventDefault();

    const p=pos(e);

    /* TEXT */

    if(tool==="text"){

        const text=prompt("Vpiši besedilo:");

        if(text){

            saveHistory();

            objects.push({

                type:"text",

                x:snap(p.x),

                y:snap(p.y),

                text:text

            });

            redraw();

            autoSave();

        }

        return;

    }

    /* MOVE */

    if(tool==="move"){

        const obj=findText(p.x,p.y);

        if(obj){

            saveHistory();

            moving=true;

            movingObject=obj;

            offsetX=p.x-obj.x;

            offsetY=p.y-obj.y;

        }

        return;

    }

    /* ERASE */

    if(tool==="erase"){

        eraseObject(p.x,p.y);

        return;

    }

    drawing=true;

    startX=snap(p.x);

    startY=snap(p.y);

});

/* POINTER MOVE */

canvas.addEventListener("pointermove",function(e){

    e.preventDefault();

    const p=pos(e);

    if(moving && movingObject){

        movingObject.x=

            snap(p.x-offsetX);

        movingObject.y=

            snap(p.y-offsetY);

        redraw();

        return;

    }

    if(!drawing)return;

    const x=snap(p.x);

    const y=snap(p.y);

    redraw();

    ctx.save();

    ctx.strokeStyle="#555";

    ctx.lineWidth=2;

    ctx.setLineDash([6,5]);

    ctx.beginPath();

    ctx.moveTo(startX,startY);

    ctx.lineTo(x,y);

    ctx.stroke();

    ctx.restore();

});

/* POINTER UP */

canvas.addEventListener("pointerup",function(e){

    if(moving){

        moving=false;

        movingObject=null;

        autoSave();

        redraw();

        return;

    }

    if(!drawing)return;

    drawing=false;

    const p=pos(e);

    const endX=snap(p.x);

    const endY=snap(p.y);

    if(

        Math.abs(endX-startX)<5 &&

        Math.abs(endY-startY)<5

    )return;

    saveHistory();

    let label="";

    if(tool==="measure"){

        label=prompt("Vpiši mero:");

    }

    if(tool==="angle"){

        label=prompt("Vpiši kot:");

    }

    objects.push({

        type:tool,

        x1:startX,

        y1:startY,

        x2:endX,

        y2:endY,

        label:label||""

    });

    redraw();

    autoSave();

});

/* FIND TEXT */

function findText(x,y){

    for(

        let i=objects.length-1;

        i>=0;

        i--

    ){

        const o=objects[i];

        if(o.type!=="text")continue;

        ctx.font="16px Arial";

        const w=ctx.measureText(o.text).width;

        if(

            x>=o.x-10 &&

            x<=o.x+w+10 &&

            y>=o.y-25 &&

            y<=o.y+10

        ){

            return o;

        }

    }

    return null;

}

/* REDRAW */

function redraw(){

    ctx.clearRect(

        0,

        0,

        canvas.clientWidth,

        canvas.clientHeight

    );

    drawGrid();

    objects.forEach(o=>{

        ctx.save();

        ctx.strokeStyle="#111";

        ctx.fillStyle="#111";

        ctx.lineWidth=2;

        if(

            o.type==="line" ||

            o.type==="measure" ||

            o.type==="angle"

        ){

            ctx.beginPath();

            ctx.moveTo(o.x1,o.y1);

            ctx.lineTo(o.x2,o.y2);

            ctx.stroke();

            if(o.label){

                const x=(o.x1+o.x2)/2;

                const y=(o.y1+o.y2)/2;

                ctx.font="16px Arial";

                const w=

                    ctx.measureText(o.label).width;

                ctx.fillStyle="white";

                ctx.fillRect(

                    x-w/2-5,

                    y-20,

                    w+10,

                    25

                );

                ctx.fillStyle="#111";

                ctx.fillText(

                    o.label,

                    x-w/2,

                    y-2

                );

            }

        }

        if(o.type==="text"){

            ctx.font="16px Arial";

            ctx.fillText(

                o.text,

                o.x,

                o.y

            );

        }

        ctx.restore();

    });

}

/* HISTORY */

function saveHistory(){

    history.push(

        JSON.stringify(objects)

    );

}

function undo(){

    if(!history.length)return;

    objects=

        JSON.parse(history.pop());

    redraw();

    autoSave();

}

/* NEW */

function newSketch(){

    if(!confirm("Izbrišem trenutno skico?"))

        return;

    objects=[];

    history=[];

    currentDraftId=null;

    currentDraftName="";

    document.getElementById("title")

        .innerText="Nova skica";

    redraw();

}

/* ERASE */

function eraseObject(x,y){

    let index=-1;

    let closest=20;

    objects.forEach((o,i)=>{

        if(!o.x1)return;

        const d=

            pointLineDistance(

                x,y,

                o.x1,o.y1,

                o.x2,o.y2

            );

        if(d<closest){

            closest=d;

            index=i;

        }

    });

    if(index<0){

        const t=findText(x,y);

        if(t){

            saveHistory();

            objects.splice(

                objects.indexOf(t),

                1

            );

            redraw();

            autoSave();

        }

        return;

    }

    saveHistory();

    objects.splice(index,1);

    redraw();

    autoSave();

}

function pointLineDistance(

    px,py,x1,y1,x2,y2

){

    const A=px-x1;

    const B=py-y1;

    const C=x2-x1;

    const D=y2-y1;

    const dot=A*C+B*D;

    const len=C*C+D*D;

    let t=dot/len;

    t=Math.max(0,Math.min(1,t));

    const xx=x1+t*C;

    const yy=y1+t*D;

    return Math.sqrt(

        (px-xx)**2+

        (py-yy)**2

    );

}

/* -------------------------

   OSNUTKI

-------------------------- */

function getDrafts(){

    return JSON.parse(

        localStorage.getItem("skiceDrafts")

        || "[]"

    );

}

function saveDraft(){

    if(currentDraftId){

        updateDraft();

        return;

    }

    document.getElementById(

        "draftNameInput"

    ).value="";

    document.getElementById(

        "nameModal"

    ).style.display="block";

}

function confirmSave(){

    const name=

        document.getElementById(

            "draftNameInput"

        ).value.trim();

    if(!name){

        alert("Vpiši ime osnutka.");

        return;

    }

    const drafts=getDrafts();

    const draft={

        id:Date.now(),

        name:name,

        objects:objects,

        gridSize:gridSize,

        gridVisible:gridVisible,

        updated:new Date().toISOString()

    };

    drafts.push(draft);

    localStorage.setItem(

        "skiceDrafts",

        JSON.stringify(drafts)

    );

    currentDraftId=draft.id;

    currentDraftName=name;

    document.getElementById(

        "title"

    ).innerText=name;

    closeNameModal();

}

function updateDraft(){

    const drafts=getDrafts();

    const index=

        drafts.findIndex(

            d=>d.id===currentDraftId

        );

    if(index<0)return;

    drafts[index].objects=objects;

    drafts[index].gridSize=gridSize;

    drafts[index].gridVisible=gridVisible;

    drafts[index].updated=

        new Date().toISOString();

    localStorage.setItem(

        "skiceDrafts",

        JSON.stringify(drafts)

    );

    alert("Osnutek je shranjen.");

}

function saveAsNew(){

    currentDraftId=null;

    currentDraftName="";

    document.getElementById(

        "draftNameInput"

    ).value="";

    document.getElementById(

        "nameModal"

    ).style.display="block";

}

function autoSave(){

    if(!currentDraftId)return;

    const drafts=getDrafts();

    const index=

        drafts.findIndex(

            d=>d.id===currentDraftId

        );

    if(index<0)return;

    drafts[index].objects=objects;

    drafts[index].gridSize=gridSize;

    drafts[index].gridVisible=gridVisible;

    drafts[index].updated=

        new Date().toISOString();

    localStorage.setItem(

        "skiceDrafts",

        JSON.stringify(drafts)

    );

}

/* OPEN DRAFTS */

function openDrafts(){

    renderDrafts();

    document.getElementById(

        "draftModal"

    ).style.display="block";

}

function closeDrafts(){

    document.getElementById(

        "draftModal"

    ).style.display="none";

}

function renderDrafts(){

    const list=

        document.getElementById(

            "draftList"

        );

    const drafts=getDrafts();

    if(!drafts.length){

        list.innerHTML=

            "<p>Še nimaš shranjenih osnutkov.</p>";

        return;

    }

    list.innerHTML="";

    drafts

    .slice()

    .reverse()

    .forEach(d=>{

        const div=

            document.createElement("div");

        div.className="draft";

        const name=

            document.createElement("div");

        name.className="draftName";

        name.innerText=

            "📄 "+d.name;

        const buttons=

            document.createElement("div");

        buttons.className="draftButtons";

        const open=

            document.createElement("button");

        open.innerText="Odpri";

        open.onclick=

            ()=>openDraft(d.id);

        const del=

            document.createElement("button");

        del.innerText="🗑️";

        del.onclick=

            ()=>deleteDraft(d.id);

        buttons.appendChild(open);

        buttons.appendChild(del);

        div.appendChild(name);

        div.appendChild(buttons);

        list.appendChild(div);

    });

}

function openDraft(id){

    const drafts=getDrafts();

    const d=

        drafts.find(

            x=>x.id===id

        );

    if(!d)return;

    objects=

        JSON.parse(

            JSON.stringify(d.objects)

        );

    gridSize=d.gridSize || 40;

    gridVisible=

        d.gridVisible !== false;

    currentDraftId=d.id;

    currentDraftName=d.name;

    document.getElementById(

        "title"

    ).innerText=d.name;

    document.getElementById(

        "info"

    ).innerText=

        "Mreža: "+

        (gridSize/4)+

        " cm";

    closeDrafts();

    redraw();

}

function deleteDraft(id){

    if(

        !confirm(

            "Res želiš izbrisati ta osnutek?"

        )

    )return;

    let drafts=getDrafts();

    drafts=

        drafts.filter(

            d=>d.id!==id

        );

    localStorage.setItem(

        "skiceDrafts",

        JSON.stringify(drafts)

    );

    if(currentDraftId===id){

        currentDraftId=null;

        currentDraftName="";

        document.getElementById(

            "title"

        ).innerText="Nova skica";

    }

    renderDrafts();

}

function closeNameModal(){

    document.getElementById(

        "nameModal"

    ).style.display="none";

}

/* IMAGE */

function saveImage(){

    redraw();

    const link=

        document.createElement("a");

    link.download=

        (currentDraftName || "skica")

        +".png";

    link.href=

        canvas.toDataURL(

            "image/png"

        );

    link.click();

}

/* PRINT */

function printSketch(){

    window.print();

}

</script>

</body>

</html>
