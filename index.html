<!DOCTYPE html>

<html lang="sl">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1.0,

maximum-scale=1.0,

user-scalable=no">

<title>SKICE</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #eeeeee;

    overflow: hidden;

}

header {

    height: 58px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 8px;

    border-bottom: 1px solid #ccc;

}

header h2 {

    margin: 0;

    font-size: 18px;

}

button {

    border: none;

    background: #eeeeee;

    border-radius: 10px;

    padding: 9px 11px;

    font-size: 14px;

}

button:active {

    transform: scale(.96);

}

#canvas {

    display: block;

    background: white;

    width: 100vw;

    height: calc(100vh - 135px);

    touch-action: none;

}

.toolbar {

    height: 77px;

    background: white;

    border-top: 1px solid #ccc;

    display: flex;

    justify-content: space-around;

    align-items: center;

}

.tool {

    background: transparent;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    width: 65px;

    height: 60px;

}

.tool span {

    font-size: 23px;

}

.tool small {

    font-size: 11px;

}

.active {

    background: #dceaff;

}

.gridMenu {

    position: fixed;

    top: 65px;

    right: 10px;

    background: white;

    border-radius: 14px;

    padding: 12px;

    box-shadow: 0 5px 25px rgba(0,0,0,.2);

    display: none;

    z-index: 20;

}

.gridMenu button {

    display: block;

    width: 130px;

    margin: 5px 0;

}

.info {

    position: fixed;

    top: 65px;

    left: 10px;

    background: rgba(0,0,0,.75);

    color: white;

    padding: 7px 10px;

    border-radius: 12px;

    font-size: 12px;

    z-index: 10;

}

@media print {

    body {

        background: white;

        overflow: visible;

    }

    header,

    .toolbar,

    .gridMenu,

    .info {

        display: none;

    }

    #canvas {

        width: 100%;

        height: auto;

    }

}

</style>

</head>

<body>

<header>

<button onclick="newSketch()">＋</button>

<h2>SKICE</h2>

<div>

<button onclick="undo()">↩</button>

<button onclick="openGridMenu()">▦</button>

<button onclick="saveImage()">📷</button>

<button onclick="printSketch()">🖨</button>

</div>

</header>

<div class="info" id="info">

Mreža: 10 cm

</div>

<div class="gridMenu" id="gridMenu">

<b>Razmik mreže</b>

<button onclick="setGrid(5)">5 cm</button>

<button onclick="setGrid(10)">10 cm</button>

<button onclick="setGrid(25)">25 cm</button>

<button onclick="setGrid(50)">50 cm</button>

<button onclick="setGrid(100)">1 m</button>

<button onclick="toggleGrid()">

Mreža ON / OFF

</button>

</div>

<canvas id="canvas"></canvas>

<div class="toolbar">

<button class="tool active"

onclick="selectTool('line',this)">

<span>╱</span>

Črta

</button>

<button class="tool"

onclick="selectTool('measure',this)">

<span>↔</span>

Mera

</button>

<button class="tool"

onclick="selectTool('angle',this)">

<span>∠</span>

Kot

</button>

<button class="tool"

onclick="selectTool('text',this)">

<span>T</span>

Besedilo

</button>

<button class="tool"

onclick="selectTool('move',this)">

<span>✋</span>

Premakni

</button>

<button class="tool"

onclick="selectTool('erase',this)">

<span>⌫</span>

Izbriši

</button>

</div>

<script>

const canvas =

document.getElementById("canvas");

const ctx =

canvas.getContext("2d");

let tool = "line";

let drawing = false;

let moving = false;

let movingObject = null;

let offsetX = 0;

let offsetY = 0;

let startX = 0;

let startY = 0;

let gridSize = 40;

let gridVisible = true;

let objects = [];

let history = [];

/* CANVAS */

function resizeCanvas() {

    const rect =

    canvas.getBoundingClientRect();

    canvas.width =

    rect.width * devicePixelRatio;

    canvas.height =

    rect.height * devicePixelRatio;

    ctx.setTransform(

        devicePixelRatio,

        0,

        0,

        devicePixelRatio,

        0,

        0

    );

    redraw();

}

window.addEventListener(

    "resize",

    resizeCanvas

);

resizeCanvas();

/* MREŽA */

function drawGrid() {

    if (!gridVisible) return;

    const width =

    canvas.clientWidth;

    const height =

    canvas.clientHeight;

    ctx.save();

    ctx.strokeStyle = "#e4e4e4";

    ctx.lineWidth = 1;

    for (

        let x = 0;

        x <= width;

        x += gridSize

    ) {

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,height);

        ctx.stroke();

    }

    for (

        let y = 0;

        y <= height;

        y += gridSize

    ) {

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(width,y);

        ctx.stroke();

    }

    ctx.restore();

}

/* SNAP */

function snap(value) {

    if (!gridVisible)

        return value;

    return Math.round(

        value / gridSize

    ) * gridSize;

}

/* ORODJE */

function selectTool(

    selected,

    button

) {

    tool = selected;

    document

    .querySelectorAll(".tool")

    .forEach(

        b => b.classList.remove("active")

    );

    button.classList.add("active");

}

/* MENI MREŽE */

function openGridMenu() {

    const menu =

    document.getElementById("gridMenu");

    menu.style.display =

    menu.style.display === "block"

    ? "none"

    : "block";

}

function setGrid(value) {

    gridSize =

    value * 4;

    document.getElementById("info")

    .innerText =

    "Mreža: " + value + " cm";

    document.getElementById("gridMenu")

    .style.display = "none";

    redraw();

}

function toggleGrid() {

    gridVisible =

    !gridVisible;

    document.getElementById("gridMenu")

    .style.display = "none";

    redraw();

}

/* POZICIJA */

function getPosition(e) {

    const rect =

    canvas.getBoundingClientRect();

    return {

        x: e.clientX - rect.left,

        y: e.clientY - rect.top

    };

}

/* POINTER DOWN */

canvas.addEventListener(

"pointerdown",

function(e) {

    e.preventDefault();

    const p =

    getPosition(e);

    /* BESEDILO */

    if (tool === "text") {

        const text =

        prompt("Vpiši besedilo:");

        if (text) {

            saveHistory();

            objects.push({

                type: "text",

                x: snap(p.x),

                y: snap(p.y),

                text: text

            });

            redraw();

        }

        return;

    }

    /* PREMIKANJE */

    if (tool === "move") {

        const object =

        findText(p.x,p.y);

        if (object) {

            saveHistory();

            moving = true;

            movingObject = object;

            offsetX =

            p.x - object.x;

            offsetY =

            p.y - object.y;

        }

        return;

    }

    /* BRISANJE */

    if (tool === "erase") {

        eraseObject(

            p.x,

            p.y

        );

        return;

    }

    drawing = true;

    startX = snap(p.x);

    startY = snap(p.y);

});

/* POINTER MOVE */

canvas.addEventListener(

"pointermove",

function(e) {

    e.preventDefault();

    const p =

    getPosition(e);

    /* PREMIKANJE TEKSTA */

    if (

        moving &&

        movingObject

    ) {

        movingObject.x =

        snap(p.x - offsetX);

        movingObject.y =

        snap(p.y - offsetY);

        redraw();

        return;

    }

    if (!drawing)

        return;

    const x =

    snap(p.x);

    const y =

    snap(p.y);

    redraw();

    ctx.save();

    ctx.strokeStyle =

    "#555";

    ctx.lineWidth = 2;

    ctx.setLineDash([

        6,

        5

    ]);

    ctx.beginPath();

    ctx.moveTo(

        startX,

        startY

    );

    ctx.lineTo(

        x,

        y

    );

    ctx.stroke();

    ctx.restore();

});

/* POINTER UP */

canvas.addEventListener(

"pointerup",

function(e) {

    if (moving) {

        moving = false;

        movingObject = null;

        redraw();

        return;

    }

    if (!drawing)

        return;

    drawing = false;

    const p =

    getPosition(e);

    const endX =

    snap(p.x);

    const endY =

    snap(p.y);

    if (

        Math.abs(endX-startX)<5 &&

        Math.abs(endY-startY)<5

    )

        return;

    saveHistory();

    let label = "";

    /* MERA */

    if (tool === "measure") {

        label =

        prompt("Vpiši mero:");

    }

    /* KOT */

    if (tool === "angle") {

        label =

        prompt("Vpiši kot:");

    }

    objects.push({

        type: tool,

        x1: startX,

        y1: startY,

        x2: endX,

        y2: endY,

        label: label || ""

    });

    redraw();

});

/* ISKANJE TEKSTA */

function findText(x,y) {

    for (

        let i = objects.length - 1;

        i >= 0;

        i--

    ) {

        const obj =

        objects[i];

        if (

            obj.type !== "text"

        )

            continue;

        ctx.font =

        "16px Arial";

        const width =

        ctx.measureText(

            obj.text

        ).width;

        if (

            x >= obj.x - 10 &&

            x <= obj.x + width + 10 &&

            y >= obj.y - 25 &&

            y <= obj.y + 10

        ) {

            return obj;

        }

    }

    return null;

}

/* RISANJE */

function redraw() {

    ctx.clearRect(

        0,

        0,

        canvas.clientWidth,

        canvas.clientHeight

    );

    drawGrid();

    objects.forEach(

    function(obj) {

        ctx.save();

        ctx.strokeStyle =

        "#111";

        ctx.fillStyle =

        "#111";

        ctx.lineWidth = 2;

        if (

            obj.type === "line" ||

            obj.type === "measure" ||

            obj.type === "angle"

        ) {

            ctx.beginPath();

            ctx.moveTo(

                obj.x1,

                obj.y1

            );

            ctx.lineTo(

                obj.x2,

                obj.y2

            );

            ctx.stroke();

            if (obj.label) {

                const x =

                (obj.x1 + obj.x2) / 2;

                const y =

                (obj.y1 + obj.y2) / 2;

                ctx.font =

                "16px Arial";

                const width =

                ctx.measureText(

                    obj.label

                ).width;

                ctx.fillStyle =

                "white";

                ctx.fillRect(

                    x-width/2-5,

                    y-20,

                    width+10,

                    25

                );

                ctx.fillStyle =

                "#111";

                ctx.fillText(

                    obj.label,

                    x-width/2,

                    y-2

                );

            }

        }

        if (

            obj.type === "text"

        ) {

            ctx.font =

            "16px Arial";

            ctx.fillText(

                obj.text,

                obj.x,

                obj.y

            );

        }

        ctx.restore();

    });

}

/* ZGODOVINA */

function saveHistory() {

    history.push(

        JSON.stringify(objects)

    );

}

/* UNDO */

function undo() {

    if (

        history.length === 0

    )

        return;

    objects =

    JSON.parse(

        history.pop()

    );

    redraw();

}

/* NOVA SKICA */

function newSketch() {

    if (

        !confirm(

            "Izbrišem trenutno skico?"

        )

    )

        return;

    saveHistory();

    objects = [];

    redraw();

}

/* BRISANJE */

function eraseObject(

    x,

    y

) {

    let index = -1;

    let closest = 20;

    objects.forEach(

    function(obj,i) {

        if (!obj.x1)

            return;

        const d =

        pointLineDistance(

            x,

            y,

            obj.x1,

            obj.y1,

            obj.x2,

            obj.y2

        );

        if (

            d < closest

        ) {

            closest = d;

            index = i;

        }

    });

    /* tudi tekst */

    if (index < 0) {

        const text =

        findText(x,y);

        if (text) {

            saveHistory();

            const i =

            objects.indexOf(text);

            objects.splice(i,1);

            redraw();

        }

        return;

    }

    saveHistory();

    objects.splice(

        index,

        1

    );

    redraw();

}

/* RAZDALJA DO ČRTE */

function pointLineDistance(

    px,

    py,

    x1,

    y1,

    x2,

    y2

) {

    const A =

    px-x1;

    const B =

    py-y1;

    const C =

    x2-x1;

    const D =

    y2-y1;

    const dot =

    A*C+B*D;

    const len =

    C*C+D*D;

    let t =

    dot/len;

    t =

    Math.max(

        0,

        Math.min(1,t)

    );

    const xx =

    x1+t*C;

    const yy =

    y1+t*D;

    return Math.sqrt(

        (px-xx)**2+

        (py-yy)**2

    );

}

/* SHRANI SLIKO */

function saveImage() {

    redraw();

    const link =

    document.createElement("a");

    link.download =

    "skica.png";

    link.href =

    canvas.toDataURL(

        "image/png"

    );

    link.click();

}

/* TISK */

function printSketch() {

    window.print();

}

</script>

</body>

</html>
